<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1a1f3a"/>
      <stop offset="100%" stop-color="#0f1328"/>
    </linearGradient>
    <!-- Subtle radial glow behind the graph -->
    <radialGradient id="graphGlow" cx="0.3" cy="0.5" r="0.4">
      <stop offset="0%" stop-color="#1e2a52" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <!-- Node glow filter -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft shadow for text -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#graphGlow)"/>

  <!-- Subtle grid pattern for depth -->
  <g opacity="0.03" stroke="#60a5fa" stroke-width="0.5">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
  </g>

  <!-- ====================================================== -->
  <!-- GRAPH DRAWING - Spring-layout style, aesthetic placement -->
  <!-- 18 nodes, well-spaced, no edge crossings              -->
  <!-- ====================================================== -->

  <!-- Node positions (spring-layout aesthetic):
       A: 80, 180    B: 180, 100   C: 290, 80
       D: 190, 240   E: 310, 190   F: 400, 110
       G: 130, 360   H: 260, 330   I: 380, 290
       J: 160, 470   K: 310, 440   L: 430, 400
       M: 480, 210   N: 530, 330   O: 100, 540
       P: 260, 540   Q: 420, 510   R: 550, 460
  -->

  <!-- Edges - curved paths for aesthetic appeal, subtle gray -->
  <g fill="none" stroke="#4a5580" stroke-width="1.8" opacity="0.5">
    <!-- Cluster 1: upper portion -->
    <path d="M 80,180 Q 120,130 180,100"/>
    <path d="M 180,100 Q 230,80 290,80"/>
    <path d="M 80,180 Q 130,200 190,240"/>
    <path d="M 180,100 Q 200,170 190,240"/>
    <path d="M 290,80 Q 300,130 310,190"/>
    <path d="M 190,240 Q 250,210 310,190"/>
    <path d="M 290,80 Q 350,85 400,110"/>
    <path d="M 310,190 Q 360,145 400,110"/>

    <!-- Cluster 2: middle portion -->
    <path d="M 190,240 Q 150,300 130,360"/>
    <path d="M 310,190 Q 280,260 260,330"/>
    <path d="M 130,360 Q 195,340 260,330"/>
    <path d="M 260,330 Q 320,305 380,290"/>
    <path d="M 400,110 Q 440,150 480,210"/>
    <path d="M 380,290 Q 430,245 480,210"/>

    <!-- Cluster 3: lower portion -->
    <path d="M 130,360 Q 140,415 160,470"/>
    <path d="M 260,330 Q 285,385 310,440"/>
    <path d="M 380,290 Q 405,345 430,400"/>
    <path d="M 160,470 Q 235,450 310,440"/>
    <path d="M 310,440 Q 370,415 430,400"/>
    <path d="M 480,210 Q 510,265 530,330"/>
    <path d="M 430,400 Q 480,360 530,330"/>

    <!-- Bottom cluster -->
    <path d="M 160,470 Q 130,510 100,540"/>
    <path d="M 160,470 Q 210,510 260,540"/>
    <path d="M 310,440 Q 285,490 260,540"/>
    <path d="M 310,440 Q 365,480 420,510"/>
    <path d="M 430,400 Q 425,455 420,510"/>
    <path d="M 530,330 Q 540,395 550,460"/>
    <path d="M 420,510 Q 485,490 550,460"/>
    <path d="M 100,540 Q 180,545 260,540"/>
  </g>

  <!-- Extra decorative faint edges for density -->
  <g fill="none" stroke="#4a5580" stroke-width="1.2" opacity="0.25">
    <path d="M 80,180 Q 100,270 130,360"/>
    <path d="M 290,80 Q 390,190 480,210"/>
    <path d="M 260,330 Q 340,370 430,400"/>
    <path d="M 100,540 Q 260,495 420,510"/>
    <path d="M 400,110 Q 350,200 310,190" stroke-dasharray="4,4"/>
    <path d="M 530,330 Q 490,400 430,400" stroke-dasharray="4,4"/>
  </g>

  <!-- Nodes - blue circles with glow -->
  <g filter="url(#nodeGlow)">
    <!-- Outer glow halos -->
    <circle cx="80"  cy="180" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="180" cy="100" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="290" cy="80"  r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="190" cy="240" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="310" cy="190" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="400" cy="110" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="130" cy="360" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="260" cy="330" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="380" cy="290" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="160" cy="470" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="310" cy="440" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="430" cy="400" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="480" cy="210" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="530" cy="330" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="100" cy="540" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="260" cy="540" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="420" cy="510" r="14" fill="#60a5fa" opacity="0.15"/>
    <circle cx="550" cy="460" r="14" fill="#60a5fa" opacity="0.15"/>

    <!-- Solid node circles -->
    <circle cx="80"  cy="180" r="7" fill="#60a5fa"/>
    <circle cx="180" cy="100" r="7" fill="#60a5fa"/>
    <circle cx="290" cy="80"  r="8" fill="#60a5fa"/>
    <circle cx="190" cy="240" r="7" fill="#60a5fa"/>
    <circle cx="310" cy="190" r="8" fill="#60a5fa"/>
    <circle cx="400" cy="110" r="7" fill="#60a5fa"/>
    <circle cx="130" cy="360" r="7" fill="#60a5fa"/>
    <circle cx="260" cy="330" r="8" fill="#60a5fa"/>
    <circle cx="380" cy="290" r="7" fill="#60a5fa"/>
    <circle cx="160" cy="470" r="8" fill="#60a5fa"/>
    <circle cx="310" cy="440" r="7" fill="#60a5fa"/>
    <circle cx="430" cy="400" r="8" fill="#60a5fa"/>
    <circle cx="480" cy="210" r="7" fill="#60a5fa"/>
    <circle cx="530" cy="330" r="7" fill="#60a5fa"/>
    <circle cx="100" cy="540" r="7" fill="#60a5fa"/>
    <circle cx="260" cy="540" r="7" fill="#60a5fa"/>
    <circle cx="420" cy="510" r="7" fill="#60a5fa"/>
    <circle cx="550" cy="460" r="8" fill="#60a5fa"/>

    <!-- Bright center dots for depth -->
    <circle cx="80"  cy="180" r="2.5" fill="#93c5fd"/>
    <circle cx="180" cy="100" r="2.5" fill="#93c5fd"/>
    <circle cx="290" cy="80"  r="3"   fill="#93c5fd"/>
    <circle cx="190" cy="240" r="2.5" fill="#93c5fd"/>
    <circle cx="310" cy="190" r="3"   fill="#93c5fd"/>
    <circle cx="400" cy="110" r="2.5" fill="#93c5fd"/>
    <circle cx="130" cy="360" r="2.5" fill="#93c5fd"/>
    <circle cx="260" cy="330" r="3"   fill="#93c5fd"/>
    <circle cx="380" cy="290" r="2.5" fill="#93c5fd"/>
    <circle cx="160" cy="470" r="3"   fill="#93c5fd"/>
    <circle cx="310" cy="440" r="2.5" fill="#93c5fd"/>
    <circle cx="430" cy="400" r="3"   fill="#93c5fd"/>
    <circle cx="480" cy="210" r="2.5" fill="#93c5fd"/>
    <circle cx="530" cy="330" r="2.5" fill="#93c5fd"/>
    <circle cx="100" cy="540" r="2.5" fill="#93c5fd"/>
    <circle cx="260" cy="540" r="2.5" fill="#93c5fd"/>
    <circle cx="420" cy="510" r="2.5" fill="#93c5fd"/>
    <circle cx="550" cy="460" r="3"   fill="#93c5fd"/>
  </g>

  <!-- ====================================================== -->
  <!-- TEXT SECTION - Right side                              -->
  <!-- ====================================================== -->

  <!-- Vertical separator line -->
  <line x1="660" y1="120" x2="660" y2="520" stroke="#60a5fa" stroke-width="1" opacity="0.15"/>

  <!-- Title: KaDraw -->
  <text x="960" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#textShadow)">
    KaDraw
  </text>

  <!-- Accent line under title -->
  <rect x="860" y="290" width="200" height="3" rx="1.5" fill="#60a5fa" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="960" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    Karlsruhe Graph Drawing
  </text>

  <!-- Tagline -->
  <text x="960" y="385" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#64748b" text-anchor="middle" letter-spacing="0.5">
    Graph drawing algorithms for aesthetic layouts
  </text>

  <!-- Decorative small graph icon near title -->
  <g transform="translate(960, 440)" opacity="0.3">
    <line x1="-20" y1="0" x2="0" y2="-15" stroke="#60a5fa" stroke-width="1.2"/>
    <line x1="0" y1="-15" x2="20" y2="0" stroke="#60a5fa" stroke-width="1.2"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#60a5fa" stroke-width="1.2"/>
    <circle cx="-20" cy="0" r="3" fill="#60a5fa"/>
    <circle cx="0" cy="-15" r="3" fill="#60a5fa"/>
    <circle cx="20" cy="0" r="3" fill="#60a5fa"/>
  </g>

  <!-- Bottom border accent -->
  <rect x="0" y="634" width="1280" height="6" fill="#60a5fa" opacity="0.3"/>
</svg>
